name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile app/voice_ime.py

      - name: Build lite exe
        env:
          DOUBAO_VARIANT: lite
        run: python -m PyInstaller --noconfirm --clean DoubaoVoice_new.spec

      - name: Verify artifact
        shell: pwsh
        run: |
          $lite = Get-Item dist\DoubaoVoice_Lite.exe
          Write-Host ("lite exe: {0:N0} bytes" -f $lite.Length)
          if ($lite.Length -lt 10MB) { throw "lite exe too small, dll missing?" }
          if ($lite.Length -ge 20MB) { throw "lite exe too large, unexpected payload?" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DoubaoVoice-lite-${{ github.sha }}
          path: dist/DoubaoVoice_Lite.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "按住快捷键说话，松开自动输入。双击运行即可，托盘图标可设置快捷键和开机自启。`n`n精简版不含智能文字整理；完整版包含豆包运行时文件，不随仓库或 Release 分发，可按 README 在本机自行构建。"
          gh release create $env:GITHUB_REF_NAME dist\DoubaoVoice_Lite.exe --title "豆包语音输入 $env:GITHUB_REF_NAME" --notes $notes
