name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile app/voice_ime.py app/api_common.py app/api_qwen.py app/api_wetype.py

      - name: Build full exe
        env:
          DOUBAO_VARIANT: full
        run: python -m PyInstaller --noconfirm --clean DoubaoVoice_new.spec

      - name: Build lite exe
        env:
          DOUBAO_VARIANT: lite
        run: python -m PyInstaller --noconfirm --clean DoubaoVoice_new.spec

      - name: Verify artifacts
        shell: pwsh
        run: |
          $full = Get-Item dist\DoubaoVoice.exe
          $lite = Get-Item dist\DoubaoVoice_Lite.exe
          Write-Host ("full exe: {0:N0} bytes" -f $full.Length)
          Write-Host ("lite exe: {0:N0} bytes" -f $lite.Length)
          if ($full.Length -lt 20MB) { throw "full exe too small, smart runtime missing?" }
          if ($lite.Length -lt 10MB) { throw "lite exe too small, dll missing?" }
          if ($lite.Length -ge 20MB) { throw "lite exe too large, smart runtime included?" }

      - name: Upload full artifact
        uses: actions/upload-artifact@v4
        with:
          name: DoubaoVoice-full-${{ github.sha }}
          path: dist/DoubaoVoice.exe
          if-no-files-found: error

      - name: Upload lite artifact
        uses: actions/upload-artifact@v4
        with:
          name: DoubaoVoice-lite-${{ github.sha }}
          path: dist/DoubaoVoice_Lite.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "按住快捷键说话，松开自动输入。双击运行即可，托盘图标可设置快捷键和开机自启。`n`n支持豆包、千问、微信输入法三种识别引擎，可在设置中切换。DoubaoVoice.exe 为完整版，内置智能文字整理运行时，无需安装豆包输入法；DoubaoVoice_Lite.exe 为精简版，没有智能文字整理，体积更小。"
          gh release create $env:GITHUB_REF_NAME dist\DoubaoVoice.exe dist\DoubaoVoice_Lite.exe --title "豆包语音输入 $env:GITHUB_REF_NAME" --notes $notes
