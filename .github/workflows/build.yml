name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          architecture: "x64"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile app/voice_ime.py app/api_common.py app/api_doubao.py app/api_qwen.py app/api_wetype.py app/api_baidu.py app/api_ifly.py app/api_smart.py

      - name: Build exe
        run: python -m PyInstaller --noconfirm --clean DoubaoVoice_new.spec

      - name: Verify artifacts
        shell: pwsh
        run: |
          $exe = Get-Item dist\DoubaoVoice.exe
          Write-Host ("exe: {0:N0} bytes" -f $exe.Length)
          if ($exe.Length -lt 10MB) { throw "exe too small, dll missing?" }
          if ($exe.Length -ge 30MB) { throw "exe too large, smart runtime still included?" }

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: DoubaoVoice-${{ github.sha }}
          path: dist/DoubaoVoice.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $intro = "按住快捷键说话，松开自动输入。双击运行即可，托盘图标可设置快捷键和开机自启。支持豆包本地 DLL、豆包云端 API、千问、微信输入法、百度输入法、讯飞六种识别引擎，可在设置中切换。`n`n本版更新："
          gh release create $env:GITHUB_REF_NAME dist\DoubaoVoice.exe --title "豆包语音输入 $env:GITHUB_REF_NAME" --notes $intro --generate-notes
